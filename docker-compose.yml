services:
  postgres:
    image: postgres:16-alpine
    container_name: mundo-perfeito-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mundo
      POSTGRES_PASSWORD: perfeito_dev
      POSTGRES_DB: mundo_perfeito
    ports:
      - "5432:5432"
    volumes:
      - mundo_perfeito_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mundo -d mundo_perfeito"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: mundo-perfeito-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
volumes:
  mundo_perfeito_pg:

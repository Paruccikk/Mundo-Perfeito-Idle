services:
  - type: web
    name: mundo-perfeito-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install && npm run build --workspace @mundo-perfeito/api
    startCommand: npm run start --workspace @mundo-perfeito/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false

  - type: web
    name: mundo-perfeito-web
    runtime: static
    buildCommand: npm install && npm run build --workspace @mundo-perfeito/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
